name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ovmf explícito: antes solo llegaba como paquete recomendado de qemu-system-x86.
      - run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86 socat ovmf
      - name: Firmware UEFI (qué instaló el paquete ovmf y cuál elige el Makefile)
        run: |
          qemu-system-x86_64 --version | head -1
          dpkg -s ovmf | grep -E '^(Package|Version)'
          ls -l /usr/share/OVMF /usr/share/qemu 2>&1 || true
          make ovmf-info
          # Sin firmware el Makefile hace SKIP del arranque UEFI: en CI eso es un fallo.
          test -n "$(make -s ovmf-info | sed -n 's/^OVMF_CODE=//p')"
      - name: Build image (fetches Copihue at the tag pinned in the Makefile)
        run: make all
      - name: Boot smoke test in QEMU (10s)
        run: |
          # -cpu qemu64: CPUID 0x80000001 EDX bit 20 (NX). Igual que el Makefile.
          timeout 10 qemu-system-x86_64 -cpu qemu64 -drive format=raw,file=build/lapageriaos.img -display none -no-reboot || code=$?
          # 124 = still running after 10s; anything else is a crash/reset
          test "${code:-0}" = "124"
      - name: Shell test (types commands with QEMU sendkey, checks serial output)
        run: make qemu-test
